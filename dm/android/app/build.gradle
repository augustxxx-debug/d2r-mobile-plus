// 安卓 App。原生库两种来法：
//   缺省：externalNativeBuild 用 dm/android/CMakeLists.txt 现编（要 -PdmGenDir=<由游戏文件生成的宿主表头目录>，见该文件头）；
//   -PdmPrebuiltJni=<目录>：直接打包已编好的 <目录>/arm64-v8a/libdm.so（构建机上 CMake 不可用时）。
//   -PdmAppId=<包名>：换一个包名装（与别人签名的同名包并排装来对照时用；缺省 com.xiaoboluo.d2r）。
// Android App. Two ways to get the native library:
//   default: externalNativeBuild builds it with dm/android/CMakeLists.txt (needs -PdmGenDir=<directory of host headers generated from the game files>, see that file's header);
//   -PdmPrebuiltJni=<dir>: package the already built <dir>/arm64-v8a/libdm.so directly (when CMake is unavailable on the build machine).
//   -PdmAppId=<id>: install under another application id (to sit beside a same-name package signed by someone else; default com.xiaoboluo.d2r).
plugins { id 'com.android.application' }

def prebuilt = project.findProperty('dmPrebuiltJni')

// 版本号跟 iOS / Mac 同一来源（dm/tools/version.sh）：versionName = DM_VERSION（标签 vX.Y.Z），versionCode = DM_BUILD（沿提交历史单调递增的构建号，
// 覆盖升级只增不减），BuildConfig.DM_VERSION_LABEL = 「1.0.0+91 · 674f5d5」给启动日志与分享摘要。没有 git 的源码副本（git archive 导出）读不到历史：
// 退回 0.0.0 / 20000 并在构建输出里提醒；-PdmBuildNumber=<正整数> 可指定构建号（version.sh 的 DM_BUILD_NUMBER）
// Version numbers from the same source as iOS / Mac (dm/tools/version.sh): versionName = DM_VERSION (tag vX.Y.Z), versionCode = DM_BUILD (build number
// strictly increasing along the commit history, so upgrades only ever go up), BuildConfig.DM_VERSION_LABEL = "1.0.0+91 · 674f5d5" for the boot log and the share summary.
// A source copy without git (git archive export) has no history: fall back to 0.0.0 / 20000 with a warning; -PdmBuildNumber=<positive integer> sets the build number (version.sh's DM_BUILD_NUMBER)
def dmVersion = ['0.0.0', 20000, '0.0.0 · 无 git']
try {
    def env = [:]; if (project.findProperty('dmBuildNumber')) env['DM_BUILD_NUMBER'] = project.property('dmBuildNumber').toString()
    def out = providers.exec {
        commandLine 'bash', '-c', 'eval "$(bash "$0")"; printf "%s\n%s\n%s\n%s\n" "$DM_VERSION" "$DM_BUILD" "$DM_BUILD_SOURCE" "$DM_VERSION_LABEL"', file('../../tools/version.sh').absolutePath
        environment env; ignoreExitValue true
    }.standardOutput.asText.get().readLines()
    if (out.size() >= 4 && out[2] != 'none' && out[1].isInteger() && out[1].toLong() < 2100000000L) dmVersion = [out[0], out[1].toInteger(), out[3]]
    else logger.warn("dm: version.sh gave no usable build number (${out}); using ${dmVersion}")
} catch (Exception e) { logger.warn("dm: version.sh failed (${e.message}); using ${dmVersion}") }

// 启动文案取自统一中英表，生成目录只在 build 下，不入库。
// Startup text comes from the shared table; generated resources stay under build.
def startupStrings = layout.buildDirectory.dir('generated/androidStrings')
def generateStartupStrings = tasks.register('generateStartupStrings', Exec) {
    inputs.files('../tools/gen_strings.py', '../../i18n/ui_text.tsv', '../../ios/tools/dm_i18n.py')
    outputs.dir(startupStrings)
    commandLine(project.findProperty('dmPython') ?: 'python3', '../tools/gen_strings.py', '--output', startupStrings.get().asFile)
}

// 复用仓库现有 iOS 图标，生成安卓资源，不重复提交图片。
// Reuse the existing iOS icon as a generated Android resource without duplicating the image.
def launcherIcon = layout.buildDirectory.dir('generated/launcherIcon')
def generateLauncherIcon = tasks.register('generateLauncherIcon', Copy) {
    from('../../ios/Assets.xcassets/AppIcon.appiconset/AppIcon1024.png')
    into(launcherIcon.map { it.dir('mipmap-nodpi') })
    rename { 'ic_launcher.png' }
}

android {
    namespace 'com.xiaoboluo.d2r'
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId project.findProperty('dmAppId') ?: 'com.xiaoboluo.d2r'
        // 产物代号（dm/PRODUCT 首行）：导入包的 pack_info.txt 要与它相同（DmActivity.ensureImported）
        // Product code (first line of dm/PRODUCT): an import pack's pack_info.txt must match it (DmActivity.ensureImported)
        buildConfigField 'String', 'DM_PRODUCT', "\"${file('../../PRODUCT').readLines()[0].trim()}\""
        minSdk 31
        targetSdk 36
        // 版本号见上面 dmVersion（dm/tools/version.sh）| version numbers: dmVersion above (dm/tools/version.sh)
        versionCode dmVersion[1]
        versionName dmVersion[0]
        buildConfigField 'String', 'DM_VERSION_LABEL', "\"${dmVersion[2]}\""
        ndk { abiFilters 'arm64-v8a' }
        if (!prebuilt) externalNativeBuild { cmake {
            arguments "-DDM_GEN_DIR=${project.findProperty('dmGenDir') ?: ''}"
            if (project.findProperty('dmPython')) arguments "-DPython3_EXECUTABLE=${project.property('dmPython')}"
            targets 'dm'
        } }
    }
    if (!prebuilt) externalNativeBuild { cmake { path '../CMakeLists.txt'; version '3.31.6' } }
    if (prebuilt) sourceSets { main { jniLibs.srcDirs = [prebuilt] } }
    sourceSets { main { res.srcDir(startupStrings.get().asFile); res.srcDir(launcherIcon.get().asFile) } }
    packaging { jniLibs { useLegacyPackaging false; keepDebugSymbols += ['**/*.so'] } }
    buildFeatures { buildConfig true }
    // 正式版签名：钥匙不进仓库，路径与密码从环境变量来（tools/shell_apk.sh release 读本机 ~/.config/dm-android/release.env）；没设就不签
    // Release signing: the key never goes into the repository; path and password come from the environment (tools/shell_apk.sh release reads the
    // local ~/.config/dm-android/release.env); unsigned when not set
    def releaseKey = System.getenv('DM_ANDROID_KEYSTORE')
    if (releaseKey) signingConfigs { release {
        storeFile file(releaseKey); storeType 'pkcs12'
        storePassword System.getenv('DM_ANDROID_KEY_PASS'); keyAlias System.getenv('DM_ANDROID_KEY_ALIAS'); keyPassword System.getenv('DM_ANDROID_KEY_PASS')
    } }
    buildTypes { release { minifyEnabled false; if (releaseKey) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.named('preBuild').configure { dependsOn(generateStartupStrings, generateLauncherIcon) }
